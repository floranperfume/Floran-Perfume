<style>
:root{
  --bg:#0b0a09;
  --bg-soft:#131110;
  --card:#191614;
  --line:rgba(201,162,39,.16);
  --line-2:rgba(201,162,39,.34);
  --gold:#c9a227;
  --gold-soft:#e8cf7a;
  --gold-dim:#8a6f1c;
  --text:#f4efe4;
  --muted:#a69c8b;
  --green:#25d366;
  --danger:#e2574c;
  --radius:16px;
  --ease:cubic-bezier(.22,.9,.28,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Tajawal',system-ui,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  line-height:1.7;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;position:relative;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ============================================================
   الخلفية المتحركة — نقاط ذهبية
   ============================================================ */
#orbs{
  position:fixed;inset:0;z-index:0;
  pointer-events:none;overflow:hidden;
  contain:strict;
  isolation:isolate;
}
.orb{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 32% 32%,
    rgba(232,207,122,.75) 0%,
    rgba(201,162,39,.48) 24%,
    rgba(201,162,39,.18) 48%,
    transparent 74%);
  opacity:var(--o);
  will-change:transform;
  transform:translate3d(0,0,0);
  animation:drift var(--dur) linear var(--delay) infinite alternate;
  backface-visibility:hidden;
}
@keyframes drift{
  from{transform:translate3d(0,0,0)}
  to{transform:translate3d(var(--dx),var(--dy),0)}
}
#orbVeil{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,transparent 0%,rgba(11,10,9,.42) 70%,rgba(11,10,9,.70) 100%);
}
.topbar,.hero,.features,section,footer{position:relative;z-index:1}

/* ============================================================
   حركات الظهور
   ============================================================ */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}
.card.reveal.in{transition-delay:0s}
.reveal.d1{transition-delay:.07s}
.reveal.d2{transition-delay:.14s}
.reveal.d3{transition-delay:.21s}

@keyframes riseIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes sheen{
  0%{background-position:-160% 0}
  60%,100%{background-position:260% 0}
}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .reveal{opacity:1;transform:none}
}

/* ============================================================
   الشريط العلوي
   ============================================================ */
.topbar{
  background:linear-gradient(90deg,var(--gold-dim),var(--gold),var(--gold-dim));
  background-size:200% 100%;
  animation:sheen 9s linear infinite;
  color:#17120a;text-align:center;
  font-size:.82rem;font-weight:800;padding:9px 16px;
}

header{
  position:sticky;top:0;z-index:50;
  background:rgba(11,10,9,.78);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:40px;height:40px;border-radius:50%;
  border:1.5px solid var(--gold);
  display:grid;place-items:center;
  color:var(--gold);font-weight:900;font-size:1.05rem;flex-shrink:0;
  box-shadow:0 0 0 4px rgba(201,162,39,.06),0 0 20px rgba(201,162,39,.18) inset;
  overflow:hidden;
}
.brand-mark img{width:78%;height:78%;object-fit:contain}
.brand-name{font-size:1.18rem;font-weight:900;letter-spacing:.3px;white-space:nowrap}
@media(max-width:420px){
  .brand-name{font-size:.98rem}
  .brand-mark{width:36px;height:36px}
  .nav{gap:8px}
  .lang button{padding:6px 11px}
}
.brand-sub{font-size:.68rem;color:var(--muted);font-weight:500;margin-top:-5px;white-space:nowrap}

.nav-right{display:flex;align-items:center;gap:22px}
.nav-links{display:flex;gap:24px;font-size:.94rem;font-weight:600}
.nav-links a{color:var(--muted);transition:color .25s}
.nav-links a:hover{color:var(--gold-soft)}
@media(max-width:860px){.nav-links{display:none}}

.lang{
  display:flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;flex-shrink:0;
}
.lang button{
  background:transparent;color:var(--muted);
  padding:6px 15px;font-size:.82rem;font-weight:800;
  transition:all .25s;
}
.lang button.on{background:var(--gold);color:#17120a}

/* ============================================================
   الواجهة
   ============================================================ */
.hero{padding:90px 0 78px;text-align:center;position:relative}
.hero-inner>*{animation:riseIn .85s var(--ease) both}
.hero-inner>*:nth-child(1){animation-delay:.02s}
.hero-inner>*:nth-child(2){animation-delay:.16s}
.hero-inner>*:nth-child(3){animation:none}
.hero-inner>*:nth-child(4){animation-delay:.94s}
.hero-inner>*:nth-child(5){animation-delay:1.12s}

.hero h1 span{display:inline-block}
.hero h1 .l1{animation:riseIn .8s var(--ease) .34s both}

.hero-emblem{
  width:min(320px,64vw);height:auto;margin:0 auto 20px;
  filter:drop-shadow(0 6px 22px rgba(201,162,39,.24));
  animation:riseIn .9s var(--ease) both,floatSlow 8s ease-in-out 1s infinite;
}
@keyframes floatSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media(max-width:640px){.hero{padding:56px 0 62px}.hero-emblem{margin-bottom:14px}}

.eyebrow{
  display:inline-block;font-size:.73rem;font-weight:800;letter-spacing:2.5px;
  color:var(--gold);border:1px solid var(--line-2);border-radius:100px;
  padding:6px 20px;margin-bottom:22px;
  background:rgba(201,162,39,.05);
}
.hero h1{font-size:clamp(2.15rem,6.4vw,3.9rem);font-weight:900;line-height:1.24;margin-bottom:16px}
.hero h1 .g{
  background:linear-gradient(100deg,
    #8a6f1c 0%, var(--gold) 18%, #fff4cc 32%, var(--gold-soft) 46%,
    var(--gold) 64%, #a8871f 82%, #8a6f1c 100%);
  background-size:220% auto;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 20px rgba(201,162,39,.22));
  animation:riseIn .8s var(--ease) .62s both, shine 5.5s linear .62s infinite;
}
@keyframes shine{
  from{background-position:0% 50%}
  to{background-position:220% 50%}
}
.hero p{color:var(--muted);font-size:clamp(1rem,2.4vw,1.16rem);max-width:570px;margin:0 auto 34px}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 32px;border-radius:100px;font-weight:800;font-size:1rem;
  transition:transform .2s var(--ease),box-shadow .25s,background .25s,color .25s,border-color .25s;
}
.btn:active{transform:scale(.96)}
.btn-gold{
  background:linear-gradient(135deg,var(--gold-soft),var(--gold));
  color:#17120a;box-shadow:0 10px 30px rgba(201,162,39,.26);
}
.btn-gold:hover{box-shadow:0 14px 40px rgba(201,162,39,.42);transform:translateY(-2px)}
.btn-ghost{border:1px solid var(--line-2);background:rgba(255,255,255,.02)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-soft)}
.btn-wa{background:var(--green);color:#04310f}
.btn-wa:hover{box-shadow:0 12px 32px rgba(37,211,102,.34)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}

/* ============================================================
   المميزات
   ============================================================ */
.features{border-block:1px solid var(--line);background:rgba(19,17,16,.72);backdrop-filter:blur(4px);contain:paint;}
.features-grid{display:grid;grid-template-columns:repeat(2,1fr)}
.feature{padding:28px 18px;text-align:center;border-inline-start:1px solid var(--line);transition:background .3s}
.feature:first-child{border-inline-start:none}
.feature:hover{background:rgba(201,162,39,.04)}
.feature-ico{font-size:1.55rem;margin-bottom:6px}
.feature b{display:block;font-size:.98rem;margin-bottom:2px}
.feature small{color:var(--muted);font-size:.81rem}
@media(max-width:680px){
  .features-grid{grid-template-columns:1fr}
  .feature{border-inline-start:none;border-top:1px solid var(--line);padding:18px}
  .feature:first-child{border-top:none}
}

/* ============================================================
   المنتجات
   ============================================================ */
section{padding:76px 0}
.sec-head{text-align:center;margin-bottom:40px}
.sec-head h2{font-size:clamp(1.7rem,4.6vw,2.35rem);font-weight:900;margin-bottom:8px}
.sec-head p{color:var(--muted);font-size:.98rem}
.sec-line{width:60px;height:2px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.filters{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.chip{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:8px 21px;border-radius:100px;font-size:.9rem;font-weight:700;transition:all .25s;
}
.chip:hover{color:var(--gold-soft);border-color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#17120a}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}

.card{
  contain:layout paint;
  background:rgba(25,22,20,.78);backdrop-filter:blur(4px);
  border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;
  transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;
}
.card:hover{transform:translateY(-6px);border-color:var(--line-2);box-shadow:0 14px 32px rgba(0,0,0,.42)}
.card-img{position:relative;aspect-ratio:4/5;background:linear-gradient(160deg,#2b241a,#100e0c);display:grid;place-items:center;overflow:hidden}
.card-img::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 30%,rgba(232,207,122,.17),transparent 46%),linear-gradient(to top,rgba(11,10,9,.34),transparent 45%)}
.card-img img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .5s var(--ease),filter .5s var(--ease);filter:saturate(1.05) contrast(1.03)}
.card:hover .card-img img{transform:scale(1.06)}
.bottle{width:44%;max-width:118px;opacity:.9;transition:transform .5s var(--ease)}
.card:hover .bottle{transform:translateY(-5px)}

.card-img .shot{
  transform:translateY(34%) scale(.86);
  opacity:0;
  transition:transform 1.05s var(--ease),opacity .7s ease;
}
.card.in .card-img .shot{transform:translateY(0) scale(1);opacity:1}
.card:hover .card-img .shot{transform:translateY(-7px) scale(1.05)}

.card-img::after{
  content:"";position:absolute;inset-inline:0;bottom:0;height:26%;
  background:linear-gradient(to top,#0e0c0a 8%,rgba(14,12,10,.55) 55%,transparent);
  pointer-events:none;z-index:1;
}
.one-size{
  display:inline-block;margin-bottom:11px;
  font-size:.82rem;font-weight:700;color:var(--gold-soft);
  background:rgba(201,162,39,.12);border:1px solid var(--line-2);
  padding:4px 13px;border-radius:100px;
}

.badge{
  position:absolute;top:12px;inset-inline-start:12px;
  background:var(--gold);color:#17120a;font-size:.7rem;font-weight:900;
  padding:4px 11px;border-radius:100px;z-index:2;
}
.badge.out{background:#4a4238;color:#cfc7ba}

.card-body{padding:16px 16px 18px;display:flex;flex-direction:column;flex:1}
.card-body h3{font-size:1.08rem;font-weight:800;margin-bottom:3px}
.notes{color:var(--muted);font-size:.83rem;margin-bottom:7px;line-height:1.6}
.desc{
  color:var(--gold-soft);font-size:.79rem;line-height:1.6;
  margin-bottom:12px;flex:1;opacity:.82;
  padding-top:7px;border-top:1px solid var(--line);
}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.price{font-size:1.16rem;font-weight:900;color:var(--gold-soft);white-space:nowrap}
.price s{font-size:.82rem;color:#8b8172;font-weight:600;margin-inline-start:8px;text-decoration-color:#c0392b}

.sale-bar{
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  background:linear-gradient(120deg,rgba(201,162,39,.16),rgba(25,22,20,.9) 60%);
  border:1px solid var(--line-2);border-radius:16px;
  padding:15px 22px;margin-bottom:26px;position:relative;overflow:hidden;
}
.sale-left{display:flex;align-items:center;gap:12px;position:relative}
.sale-badge{
  background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#17120a;
  font-weight:900;font-size:1rem;padding:6px 15px;border-radius:100px;white-space:nowrap;
  box-shadow:0 0 20px rgba(201,162,39,.35);
}
.sale-txt{font-weight:700;font-size:.95rem}
.clock{display:flex;align-items:center;gap:6px;position:relative;direction:ltr}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.clock .unit{
  min-width:52px;text-align:center;
  background:rgba(11,10,9,.55);border:1px solid var(--line-2);border-radius:10px;padding:6px 4px;
}
.clock .unit b{display:block;font-size:1.18rem;font-weight:900;color:var(--gold-soft);line-height:1.15;
  font-variant-numeric:tabular-nums}
.clock .unit small{font-size:.62rem;color:var(--muted);letter-spacing:.4px}
.clock .colon{color:var(--gold);font-weight:900;opacity:.5;padding-bottom:9px}

.badge.off{
  inset-inline-start:auto;inset-inline-end:12px;
  background:#c0392b;color:#fff;letter-spacing:.3px;
  box-shadow:0 4px 16px rgba(192,57,43,.4);
}

.sizes{display:flex;gap:7px;margin-bottom:11px}
.size-btn{
  flex:1;padding:7px 4px;border-radius:9px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);
  color:var(--muted);font-weight:700;font-size:.86rem;
  transition:all .22s;line-height:1.25;
}
.size-btn:hover{border-color:var(--gold);color:var(--gold-soft)}
.size-btn.on{background:rgba(201,162,39,.16);border-color:var(--gold);color:var(--gold-soft)}
.size-btn small{display:block;font-size:.72rem;opacity:.85;font-weight:600}

.add{
  width:100%;padding:11px;border-radius:10px;
  background:rgba(201,162,39,.1);border:1px solid var(--line);
  color:var(--gold-soft);font-weight:800;font-size:.93rem;transition:all .25s;
}
.add:hover:not(:disabled){background:var(--gold);color:#17120a;border-color:var(--gold)}
.add:disabled{opacity:.38;cursor:not-allowed}
.add.added{background:var(--green);color:#04310f;border-color:var(--green)}

@media(max-width:640px){
  .grid{grid-template-columns:1fr 1fr;gap:13px}
  .card-body{padding:12px 12px 14px}
  .card-body h3{font-size:.95rem}
  .notes{font-size:.73rem;margin-bottom:5px}
  .desc{font-size:.7rem;margin-bottom:9px;padding-top:5px}
  .price{font-size:.98rem}
  .price s{display:block;margin:0}
  .add{padding:9px;font-size:.85rem}
  .size-btn{font-size:.78rem;padding:6px 2px}
  .card-img .badge:not(.out):not(.off){top:auto;bottom:10px;font-size:.64rem;padding:3px 9px}
  .card-img .badge.off{font-size:.66rem;padding:3px 9px}
  .size-btn small{font-size:.66rem}
  .card-img{aspect-ratio:4/5}
}

/* ============================================================
   عروض ومميزات إضافية
   ============================================================ */
.about{background:rgba(19,17,16,.72);backdrop-filter:blur(4px);border-block:1px solid var(--line);contain:paint;}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
@media(max-width:860px){.about-grid{grid-template-columns:1fr;gap:30px}}
.about h2{font-size:clamp(1.6rem,4.2vw,2.2rem);font-weight:900;margin-bottom:14px}
.about-visual{
  aspect-ratio:4/3;border-radius:var(--radius);border:1px solid var(--line);
  background:radial-gradient(circle at 30% 30%,rgba(201,162,39,.17),transparent 62%),linear-gradient(160deg,#241f18,#0f0d0b);
  display:grid;place-items:center;
}

.loyalty{padding:10px 0 76px}
.loy-box{
  display:flex;align-items:center;gap:28px;
  background:linear-gradient(135deg,rgba(201,162,39,.10),rgba(25,22,20,.85) 55%);
  border:1px solid var(--line-2);border-radius:20px;
  padding:26px 30px;position:relative;overflow:hidden;
}
.loy-img{
  width:132px;height:auto;flex-shrink:0;
  filter:drop-shadow(0 10px 26px rgba(201,162,39,.34));
  animation:float 6s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.loy-text{position:relative;flex:1;min-width:0}
.loy-badge{
  display:inline-block;font-size:.7rem;font-weight:900;letter-spacing:1.6px;
  color:#17120a;background:linear-gradient(135deg,var(--gold-soft),var(--gold));
  padding:4px 13px;border-radius:100px;margin-bottom:9px;
}
.loy-text h2{font-size:clamp(1.3rem,3.4vw,1.75rem);font-weight:900;margin-bottom:7px}
.loy-text p{color:var(--muted);font-size:.95rem;margin-bottom:15px}
.loy-steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.loy-step{display:flex;align-items:center;gap:8px;font-size:.87rem;color:var(--muted)}
.loy-step b{
  width:27px;height:27px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-size:.82rem;
  border:1px solid var(--line-2);color:var(--gold-soft);background:rgba(201,162,39,.08);
}
.loy-step.gift b{
  background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#17120a;border-color:var(--gold);
}
.loy-arrow{color:var(--gold);opacity:.55}
html[dir="rtl"] .loy-arrow{transform:scaleX(-1)}
.loy-fine{color:#7d7466;font-size:.76rem}

.points{list-style:none;margin-top:6px}
.points li{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
  color:var(--muted);font-size:.97rem;line-height:1.75;
  opacity:0;transform:translateY(22px) scale(.97);
  transition:opacity .6s var(--ease),transform .6s var(--ease);
}
.points li.in{opacity:1;transform:none}
.points .dot{
  flex-shrink:0;width:9px;height:9px;border-radius:50%;margin-top:.62em;
  background:linear-gradient(135deg,var(--gold-soft),var(--gold));
  box-shadow:0 0 0 4px rgba(201,162,39,.12),0 0 14px rgba(201,162,39,.5);
}

/* ============================================================
   السلة
   ============================================================ */
.cart-fab{
  position:fixed;inset-inline-end:20px;bottom:20px;z-index:60;
  background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#17120a;
  border-radius:100px;padding:14px 24px;font-weight:900;font-size:.97rem;
  display:flex;align-items:center;gap:9px;
  box-shadow:0 12px 34px rgba(201,162,39,.42);
  transform:translateY(130px);transition:transform .4s var(--ease);
}
.cart-fab.show{transform:translateY(0)}

const $ = id => document.getElementById(id);
let lang = "ar";
const t  = k => T[lang][k];
const L  = o => (o && (o[lang] || o.ar)) || "";
const waBase = "https://wa.me/" + CONFIG.whatsapp;
const fmt = n => n.toLocaleString("en-US") + " " + CONFIG.currency[lang];

const BOTTLE = `<svg class="bottle" viewBox="0 0 100 150" fill="none">
  <rect x="38" y="4" width="24" height="18" rx="3" fill="#c9a227" opacity=".8"/>
  <rect x="43" y="20" width="14" height="14" fill="#c9a227" opacity=".4"/>
  <rect x="22" y="32" width="56" height="112" rx="12" fill="#c9a227" opacity=".14" stroke="#c9a227" stroke-opacity=".45"/>
  <rect x="33" y="70" width="34" height="46" rx="5" fill="#c9a227" opacity=".2"/>
</svg>`;

(function buildOrbs(){
  const host = $("orbs");
  if(!host) return;
  const N = window.innerWidth < 700 ? 5 : 10;
  let html = "";
  for (let i = 0; i < N; i++){
    const size = 60 + Math.random() * 230;
    const dur  = 18 + Math.random() * 24;
    const delay = -Math.random() * 24;
    const dx   = (Math.random() * 2 - 1) * 190;
    const dy   = (Math.random() * 2 - 1) * 170;
    const o    = 0.16 + Math.random() * 0.16;
    html += `<span class="orb" style="width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${dur}s;--delay:${delay}s;--dx:${dx}px;--dy:${dy}px;--o:${o};"></span>`;
  }
  host.innerHTML = html;
})();

function applyLang(next){
  lang = next;
  document.documentElement.lang = lang;
  document.documentElement.dir  = lang === "ar" ? "rtl" : "ltr";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });

  $("btnAr").classList.toggle("on", lang === "ar");
  $("btnEn").classList.toggle("on", lang === "en");

  const brand = L(CONFIG.brand);
  document.title = brand + " | " + L(CONFIG.tagline);
  $("brandName").textContent = brand;
  $("brandSub").textContent  = L(CONFIG.tagline);
  $("footName").textContent  = brand;
  $("copyName").textContent  = brand;
  $("year").textContent      = new Date().getFullYear();

  const ask = waBase + "?text=" + encodeURIComponent(t("askMsg"));
  $("heroWa").href = ask; $("footWa").href = ask;

  buildProvinces();
  buildCities();
  renderFilters();
  renderGrid();
  sync();
}
$("btnAr").onclick = () => applyLang("ar");
$("btnEn").onclick = () => applyLang("en");

function buildProvinces(){
  const sel = $("iProv"), cur = sel.value;
  sel.innerHTML = `<option value="">${t("provPick")}</option>` +
    REGIONS.map((r,i) => `<option value="${i}">${L(r)}</option>`).join("");
  if (cur !== "") sel.value = cur;
}

function buildCities(){
  const sel = $("iCity"), pi = $("iProv").value, cur = sel.value;
  if (pi === ""){
    sel.innerHTML = `<option value="">${t("cityFirst")}</option>`;
    sel.disabled = true;
    sel.value = "";
    return;
  }
  sel.disabled = false;
  sel.innerHTML = `<option value="">${t("cityPick")}</option>` +
    REGIONS[+pi].cities.map((c,i) => `<option value="${i}">${L(c)}</option>`).join("");
  if (cur !== "") sel.value = cur;
}

$("iProv").addEventListener("change", () => {
  $("iCity").value = "";
  buildCities();
  sync();
});
$("iCity").addEventListener("change", sync);

function deliveryFee(){
  const pi = $("iProv").value, ci = $("iCity").value;
  if (pi === "" || ci === "") return null;
  const city = REGIONS[+pi].cities[+ci];
  return city && city.fee != null ? city.fee : CONFIG.delivery.default;
}

const chosen = {};
CONFIG.products.forEach(p => chosen[p.id] = p.sizes.reduce((a,b) => b.ml > a.ml ? b : a).ml);

const sizeOf = (p, ml) => p.sizes.find(s => s.ml === ml) || p.sizes[0];
const szText = sz => sz.label ? L(sz.label) : `${sz.ml} ${t("ml")}`;
const szOf = (id, ml) => szText(sizeOf(product(id), ml));
const shotOf = (p, ml) => sizeOf(p, ml).img || p.image;
const product = id => CONFIG.products.find(p => p.id === id);

let activeFamily = "all";
const scentFamilies = [["all", "filterAll"], ["woody", "filterWoody"], ["floral", "filterFloral"], ["amber", "filterAmber"]];

function renderFilters(){
  $("filters").innerHTML = scentFamilies.map(([family, label]) => `
    <button class="chip${activeFamily === family ? " on" : ""}" type="button" data-family="${family}">${t(label)}</button>`).join("");
  document.querySelectorAll("[data-family]").forEach(button => {
    button.onclick = () => {
      activeFamily = button.dataset.family;
      renderFilters();
      renderGrid();
    };
  });
}

function priceHTML(p){
  const sz = sizeOf(p, chosen[p.id]);
  return fmt(sz.price) + (sz.was ? `<s>${sz.was.toLocaleString("en-US")}</s>` : "");
}

function renderGrid(){
  const products = activeFamily === "all" ? CONFIG.products : CONFIG.products.filter(p => p.family === activeFamily);
  $("grid").innerHTML = products.map((p,i) => `
    <article class="card reveal${i%4===1?" d1":i%4===2?" d2":i%4===3?" d3":""}" data-card="${p.id}">
      <div class="card-img">
        ${p.image ? `<img class="shot" data-shot="${p.id}" src="${shotOf(p, chosen[p.id])}" alt="${L(p.name)}" onerror="this.onerror=null; this.src=SVG_FALLBACK;" loading="lazy">` : BOTTLE}
        ${!p.inStock ? `<span class="badge out">${t("outBadge")}</span>` : L(p.tag) ? `<span class="badge">${L(p.tag)}</span>` : ""}
      </div>
      <div class="card-body">
        <h3>${L(p.name)}</h3>
        <p class="notes">${L(p.notes)}</p>
        ${L(p.desc) ? `<p class="desc">${L(p.desc)}</p>` : ""}

        ${p.sizes.length > 1 ? `
        <div class="sizes">
          ${p.sizes.map(sz => `
            <button class="size-btn${chosen[p.id]===sz.ml?" on":""}" data-size="${p.id}" data-ml="${sz.ml}">
              ${szText(sz)}
              <small>${sz.price.toLocaleString("en-US")}</small>
            </button>`).join("")}
        </div>` : `<div class="one-size">${szText(p.sizes[0])}</div>`}

        <div class="card-meta">
          <div class="price" data-price="${p.id}">${priceHTML(p)}</div>
        </div>

        <button class="add" data-id="${p.id}" ${p.inStock?"":"disabled"}>
          ${p.inStock ? t("addBtn") : t("outBtn")}
        </button>
      </div>
    </article>`).join("");

  document.querySelectorAll("[data-size]").forEach(b => {
    b.onclick = () => {
      const id = +b.dataset.size;
      chosen[id] = +b.dataset.ml;
      const prod = product(id);
      const card = document.querySelector(`[data-card="${id}"]`);
      card.querySelectorAll("[data-size]").forEach(x => x.classList.toggle("on", +x.dataset.ml === chosen[id]));
      card.querySelector(`[data-price="${id}"]`).innerHTML = priceHTML(prod);
      const shot = card.querySelector(`[data-shot="${id}"]`);
      if (shot) shot.src = shotOf(prod, chosen[id]);
    };
  });

  document.querySelectorAll(".add").forEach(b => {
    if (b.disabled) return;
    b.onclick = () => {
      add(+b.dataset.id, chosen[+b.dataset.id]);
      b.textContent = t("added"); b.classList.add("added");
      setTimeout(() => { b.textContent = t("addBtn"); b.classList.remove("added"); }, 1300);
    };
  });

  observeReveals();
}

let cart = [];
const lineOf = (id, ml) => cart.find(l => l.id === id && l.ml === ml);
const linePrice = l => sizeOf(product(l.id), l.ml).price;
const subtotal = () => cart.reduce((s,l) => s + linePrice(l) * l.qty, 0);
const count = () => cart.reduce((s,l) => s + l.qty, 0);
const grandTotal = () => subtotal() + (deliveryFee() || 0);

function add(id, ml){
  const l = lineOf(id, ml);
  l ? l.qty++ : cart.push({ id, ml, qty:1 });
  sync(); showToast(t("toastAdd"), true);
}
function setQty(id, ml, d){
  const l = lineOf(id, ml);
  if (!l) return;
  l.qty += d;
  if (l.qty <= 0) cart = cart.filter(x => !(x.id === id && x.ml === ml));
  sync();
  if (!cart.length) closeDrawer();
}

function sync(){
  const fee = deliveryFee();
  $("fabCount").textContent = count();
  $("fab").classList.toggle("show", cart.length > 0);
  $("subtotal").textContent = fmt(subtotal());
  $("delivery").textContent = fee === null ? t("pickCity") : fmt(fee);
  $("total").textContent    = fmt(grandTotal());
  $("form").style.display   = cart.length ? "block" : "none";

  $("lines").innerHTML = cart.length ? cart.map(l => {
    const p = product(l.id);
    return `<div class="line">
      <div class="line-img"><img src="${p.image}" alt="" onerror="this.onerror=null; this.src=SVG_FALLBACK;"></div>
      <div class="line-info"><b>${L(p.name)}</b><small>${szOf(l.id, l.ml)} · ${fmt(linePrice(l))}</small></div>
      <div class="qty">
        <button data-m="${p.id}" data-ml="${l.ml}">−</button>
        <span>${l.qty}</span>
        <button data-p="${p.id}" data-ml="${l.ml}">+</button>
      </div>
    </div>`;
  }).join("") : `<div class="empty"><div>🧴</div>${t("emptyCart")}</div>`;

  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => setQty(+b.dataset.p, +b.dataset.ml, 1));
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => setQty(+b.dataset.m, +b.dataset.ml, -1));
}

function openDrawer(){ $("toast").classList.remove("show"); $("drawer").classList.add("show"); $("overlay").classList.add("show"); document.body.style.overflow="hidden"; }
function closeDrawer(){ $("drawer").classList.remove("show"); $("overlay").classList.remove("show"); document.body.style.overflow=""; }
$("fab").onclick = () => { if ($("success").classList.contains("show")) resetDrawer(); openDrawer(); };
$("closeDrawer").onclick = closeDrawer;
$("overlay").onclick = closeDrawer;

let toastTimer;
function showToast(msg, ok){
  const el = $("toast");
  el.textContent = msg;
  el.style.background = ok ? "var(--green)" : "var(--danger)";
  el.style.color = ok ? "#04310f" : "#fff";
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function normalisePhone(raw){
  let d = (raw || "").replace(/\D/g, "");
  if (d.startsWith("00964")) d = d.slice(5);
  else if (d.startsWith("964")) d = d.slice(3);
  if (d.startsWith("0")) d = d.slice(1);
  return /^7\d{9}$/.test(d) ? "0" + d : null;
}

function validate(){
  const name  = $("iName").value.trim();
  const phone = normalisePhone($("iPhone").value);
  const pi    = $("iProv").value;
  const ci    = $("iCity").value;
  const addr  = $("iAddr").value.trim();

  $("fName").classList.toggle("bad", !name);
  $("fPhone").classList.toggle("bad", !phone);
  $("fProv").classList.toggle("bad", pi === "");
  $("fCity").classList.toggle("bad", ci === "");
  $("fAddr").classList.toggle("bad", addr.length < 3);

  if (!name || !phone || pi === "" || ci === "" || addr.length < 3) return null;

  return {
    name, phone, addr,
    prov: L(REGIONS[+pi]),
    city: L(REGIONS[+pi].cities[+ci]),
    fee:  deliveryFee(),
    notes: $("iNotes").value.trim()
  };
}

function makeRef(){
  const s = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let r = "";
  for (let i = 0; i < 5; i++) r += s[Math.floor(Math.random() * s.length)];
  return "FL-" + r;
}

function orderText(d, ref){
  let m = `*${t("mOrder")} — ${L(CONFIG.brand)}*\n${ref}\n\n`;
  cart.forEach(l => {
    const p = product(l.id);
    m += `• ${L(p.name)} (${szOf(l.id, l.ml)}) × ${l.qty} = ${fmt(linePrice(l) * l.qty)}\n`;
  });
  m += `\n${t("mSub")}: ${fmt(subtotal())}\n`;
  m += `${t("mDelivery")}: ${fmt(d.fee)}\n`;
  m += `*${t("mTotal")}: ${fmt(subtotal() + d.fee)}*\n\n`;
  m += `*${t("mCustomer")}*\n`;
  m += `${t("mName")}: ${d.name}\n${t("mPhone")}: ${d.phone}\n`;
  m += `${t("mProv")}: ${d.prov}\n${t("mCity")}: ${d.city}\n`;
  m += `${t("mAddr")}: ${d.addr}\n`;
  if (d.notes) m += `${t("mNotes")}: ${d.notes}\n`;
  return m;
}

// دالة إرسال الطلب للبوت مباشرة عبر التليجرام API
async function sendTelegramOrder(d, ref) {
  if (!CONFIG.telegram || !CONFIG.telegram.token || !CONFIG.telegram.chatId) return false;
  
  let m = `🛍 *${t("mOrder")} — ${L(CONFIG.brand)}*\n`;
  m += `🆔 *رقم الطلب:* \`${ref}\`\n\n`;
  m += `📦 *المنتجات:*\n`;
  cart.forEach(l => {
    const p = product(l.id);
    m += `• ${L(p.name)} (${szOf(l.id, l.ml)}) × ${l.qty} = *${fmt(linePrice(l) * l.qty)}*\n`;
  });
  m += `\n💰 *المجموع الفرعي:* ${fmt(subtotal())}\n`;
  m += `🚚 *التوصيل:* ${fmt(d.fee)}\n`;
  m += `💳 *المجموع الكلي:* *${fmt(subtotal() + d.fee)}*\n\n`;
  m += `👤 *بيانات الزبون:*\n`;
  m += `• *الاسم:* ${d.name}\n`;
  m += `• *الهاتف:* \`${d.phone}\`\n`;
  m += `• *المحافظة:* ${d.prov}\n`;
  m += `• *المدينة:* ${d.city}\n`;
  m += `• *العنوان:* ${d.addr}\n`;
  if (d.notes) m += `• *ملاحظات:* ${d.notes}\n`;

  try {
    const res = await fetch(`https://api.telegram.org/bot${CONFIG.telegram.token}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: CONFIG.telegram.chatId,
        text: m,
        parse_mode: "Markdown"
      })
    });
    const data = await res.json();
    return data.ok;
  } catch (e) {
    console.error("Telegram send error:", e);
    return false;
  }
}

function showSuccess(ref, d){
  $("lines").style.display = "none";
  $("form").style.display  = "none";
  $("drawerFoot").classList.add("hide");
  $("okRef").textContent = ref;
  $("okWa").href = waBase + "?text=" + encodeURIComponent(orderText(d, ref));
  $("success").classList.add("show");
  cart = [];
  $("fabCount").textContent = 0;
  $("fab").classList.remove("show");
}

function resetDrawer(){
  $("success").classList.remove("show");
  $("lines").style.display = "";
  $("drawerFoot").classList.remove("hide");
  ["iName","iPhone","iProv","iCity","iAddr","iNotes"].forEach(id => $(id).value = "");
  buildCities();
  sync();
}
$("okDone").onclick = () => { closeDrawer(); setTimeout(resetDrawer, 400); };

let sending = false;
$("sendWa").onclick = async () => {
  if (sending || !cart.length) return;

  const d = validate();
  if (!d){
    showToast(t("toastFix"), false);
    return;
  }

  const ref = makeRef();
  const btn = $("sendWa");
  sending = true;
  btn.classList.add("loading");
  btn.disabled = true;

  // 1. محاولة الإرسال للبوت عبر التليجرام أولاً
  let ok = await sendTelegramOrder(d, ref);

  // 2. إذا لم يكن البوت مضبوطاً أو فشل، نحاول الإرسال لـ Endpoint السيرفر
  if (!ok) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch("/api/order", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ ref, name:d.name, phone:d.phone, address:d.addr, items:cart }),
        signal: ctrl.signal
      });
      clearTimeout(timer);
      ok = res.ok;
    } catch { ok = false; }
  }

  sending = false;
  btn.classList.remove("loading");
  btn.disabled = false;

  if (ok){
    showSuccess(ref, d);
  } else {
    // 3. التراجع للواتساب في حال عدم توفر الطرق السابقة
    showToast(t("toastFail"), false);
    window.open(waBase + "?text=" + encodeURIComponent(orderText(d, ref)), "_blank");
  }
};

let io;
function observeReveals(){
  if (!("IntersectionObserver" in window)){
    document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
    return;
  }
  if (!io) io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold:.15 });
  document.querySelectorAll(".reveal:not(.in)").forEach(el => io.observe(el));
}

function updateCountdown() {
  const diff = SALE_END - Date.now();
  if (diff <= 0) {
    if ($("saleBar")) $("saleBar").hidden = true;
    return;
  }
  if ($("saleBar")) $("saleBar").hidden = false;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / 1000 / 60) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  if ($("cd")) $("cd").textContent = String(days).padStart(2, "0");
  if ($("ch")) $("ch").textContent = String(hours).padStart(2, "0");
  if ($("cm")) $("cm").textContent = String(minutes).padStart(2, "0");
  if ($("cs")) $("cs").textContent = String(seconds).padStart(2, "0");
}

window.addEventListener("DOMContentLoaded", () => {
  applyLang("ar");
  observeReveals();
  setInterval(updateCountdown, 1000);
  updateCountdown();
});
</script>
